name: Keep Maof Engine Warm

# Render free tier spins the server down after ~15 min of inactivity,
# causing a 30-50s cold start on the next request. This pings the health
# endpoint every 10 minutes so the engine stays warm for live demos.
#
# Cost: one short curl per run (~10s runner time). Well within free limits.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch: {}        # allow manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health (with one retry)
        run: |
          URL="https://maof-project.onrender.com/api/v1/health"
          echo "Pinging $URL ..."
          for attempt in 1 2; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            echo "Attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/body
              echo ""
              echo "Engine is warm ✓"
              exit 0
            fi
            echo "Retry in 20s (server may be cold-starting)..."
            sleep 20
          done
          echo "Warning: engine did not return 200 after retries (non-fatal)."
          exit 0
